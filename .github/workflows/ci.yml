name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  package:
    name: Package build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Test HanguStepKit
        working-directory: Packages/HanguStepKit
        run: swift test --parallel

  app:
    name: App build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Build
        run: |
          xcodebuild build \
            -project HanguStep.xcodeproj \
            -scheme HanguStep \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
          test ${PIPESTATUS[0]} -eq 0
