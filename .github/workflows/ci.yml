name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  package:
    name: Package build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: |
          # Newest stable Xcode on the runner (the app is built with Xcode 26+ locally).
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Guard against third-party dependencies (AC-14)
        run: |
          # Package.swift and project.yml may reference local packages only.
          if grep -nE '\.package\(' Packages/HanguStepKit/Package.swift \
             || grep -nE '^\s+(url|github):' project.yml \
             || git ls-files | grep -E '(^|/)Package\.resolved$'; then
            echo "::error::A remote package was added. Justify it in an ADR and update this check."
            exit 1
          fi
      - name: Test HanguStepKit
        working-directory: Packages/HanguStepKit
        run: swift test --parallel
      - name: Lint bundled content
        working-directory: Packages/HanguStepKit
        run: |
          swift run content-lint generate-questions
          git diff --exit-code -- Sources/Persistence/Resources/Content

  app:
    name: App build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: |
          # Newest stable Xcode on the runner (the app is built with Xcode 26+ locally).
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Build
        run: |
          xcodebuild build \
            -project HanguStep.xcodeproj \
            -scheme HanguStep \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
          test ${PIPESTATUS[0]} -eq 0

  app-macos:
    name: App build (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: |
          # Newest stable Xcode on the runner (the app is built with Xcode 26+ locally).
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Build
        run: |
          xcodebuild build \
            -project HanguStep.xcodeproj \
            -scheme HanguStep \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
          test ${PIPESTATUS[0]} -eq 0
