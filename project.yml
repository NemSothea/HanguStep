name: HanguStep
options:
  bundleIdPrefix: com.nemsothea
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
packages:
  HanguStepKit:
    path: Packages/HanguStepKit
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  HanguStep:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        # Written into App/Info.plist by XcodeGen; literal values there would win over
        # the build settings, so point them at MARKETING_VERSION / CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS through the system TLS stack: exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        # YES unless the build is unsigned (CLI `CODE_SIGNING_ALLOWED=NO`): an unsigned
        # build has no CloudKit entitlement and CloudKit traps the process at startup.
        HSCloudKitAvailable: $(HANGUSTEP_CLOUDKIT_AVAILABLE)
    dependencies:
      - package: HanguStepKit
        product: Domain
      - package: HanguStepKit
        product: Persistence
      - package: HanguStepKit
        product: DesignSystem
      - package: HanguStepKit
        product: Features
      - package: HanguStepKit
        product: Assistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nemsothea.hangustep
        PRODUCT_NAME: HanguStep
        MARKETING_VERSION: "1.0.0"
        HANGUSTEP_CLOUDKIT_AVAILABLE: $(CODE_SIGNING_ALLOWED)
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        CODE_SIGN_ENTITLEMENTS: App/HanguStep.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/HanguStep-macOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - HanguStepUITests
  HanguStepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HanguStep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nemsothea.hangustep.uitests
        TEST_TARGET_NAME: HanguStep
        GENERATE_INFOPLIST_FILE: YES
